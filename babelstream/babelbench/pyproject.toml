[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "babelbench"
dynamic = ["version"]
description = "Turn BabelStream output into JSON records, tables and plots"
readme = "readme.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8"]

[project.scripts]
babelbench = "babelbench.cli:entry"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# ------------------------------------------------------------------------------
# Build
# ------------------------------------------------------------------------------

[tool.hatch.version]
path = "src/babelbench/metadata.py"

[tool.hatch.build.targets.wheel]
packages = ["src/babelbench"]

# ------------------------------------------------------------------------------
# Lint and format
# ------------------------------------------------------------------------------

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
